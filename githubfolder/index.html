<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Gallega - Barcode Scanner</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
        #reader__scan_region video {
            border-radius: 8px;
        }
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-down {
            animation: slideDown 0.3s ease-out forwards;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.9); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounceIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
    </style>
</head>
<body className="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // Set Babel to classic runtime to avoid 'import' statements
        Babel.registerPreset("my-preset", {
          presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
        });
    </script>
    <script type="text/babel" data-presets="my-preset">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [products, setProducts] = useState({});
            const [scannedProduct, setScannedProduct] = useState(null);
            const [lastBarcode, setLastBarcode] = useState("");
            const [isScannerActive, setIsScannerActive] = useState(false);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");
            const [cart, setCart] = useState(() => {
                const savedCart = localStorage.getItem('lagallega_cart');
                return savedCart ? JSON.parse(savedCart) : [];
            });
            const [showCart, setShowCart] = useState(false);
            
            const html5QrCodeRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('lagallega_cart', JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                // Fetch products data
                console.log("Fetching products.json...");
                fetch('products.json')
                    .then(response => {
                        console.log("Response received:", response.status);
                        if (!response.ok) throw new Error('Failed to load products database');
                        return response.json();
                    })
                    .then(data => {
                        console.log("Products loaded:", Object.keys(data).length);
                        setProducts(data);
                        
                        // Update cart items with latest product data from products.json
                        setCart(prevCart => {
                            return prevCart.map(item => {
                                if (data[item.barcode]) {
                                    // Keep the quantity but update everything else from the latest data
                                    return { ...data[item.barcode], quantity: item.quantity };
                                }
                                return item;
                            });
                        });
                        
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Fetch error:", err);
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            const startScanner = () => {
                setIsScannerActive(true);
                setScannedProduct(null);
                setError(null);
                
                setTimeout(() => {
                    const html5QrCode = new Html5Qrcode("reader");
                    html5QrCodeRef.current = html5QrCode;
                    
                    const config = { fps: 10, qrbox: { width: 250, height: 150 } };
                    
                    html5QrCode.start(
                        { facingMode: "environment" }, 
                        config, 
                        (decodedText) => {
                            // On success
                            console.log("Scanned:", decodedText);
                            handleScan(decodedText);
                        },
                        (errorMessage) => {
                            // parse error, ignore it
                        }
                    ).catch(err => {
                        console.error("Unable to start scanner", err);
                        setError("Camera access denied or not available. Ensure you are using HTTPS.");
                        setIsScannerActive(false);
                    });
                }, 100);
            };

            const stopScanner = () => {
                if (html5QrCodeRef.current) {
                    html5QrCodeRef.current.stop().then(() => {
                        setIsScannerActive(false);
                    }).catch(err => console.error("Error stopping scanner", err));
                } else {
                    setIsScannerActive(false);
                }
            };

            const handleScan = (barcode) => {
                setLastBarcode(barcode);
                if (products[barcode]) {
                    setScannedProduct(products[barcode]);
                    stopScanner();
                    setError(null);
                    // Vibrate if supported
                    if (navigator.vibrate) navigator.vibrate(200);
                } else {
                    stopScanner();
                    setError(`Product not found for barcode: ${barcode}`);
                }
            };

            const addToCart = (product) => {
                setCart(prevCart => {
                    const existingItem = prevCart.find(item => item.barcode === product.barcode);
                    if (existingItem) {
                        return prevCart.map(item => 
                            item.barcode === product.barcode 
                            ? { ...item, quantity: item.quantity + 1 } 
                            : item
                        );
                    }
                    return [...prevCart, { ...product, quantity: 1 }];
                });
                setScannedProduct(null);
                setShowCart(true);
            };

            const updateQuantity = (barcode, delta) => {
                setCart(prevCart => {
                    return prevCart.map(item => {
                        if (item.barcode === barcode) {
                            const newQuantity = Math.max(0, item.quantity + delta);
                            return { ...item, quantity: newQuantity };
                        }
                        return item;
                    }).filter(item => item.quantity > 0);
                });
            };

            const clearCart = () => {
                if (confirm("Are you sure you want to clear the cart?")) {
                    setCart([]);
                }
            };

            const cartTotal = cart.reduce((sum, item) => {
                const price = parseFloat(item.price.replace(/\./g, '').replace(',', '.'));
                return sum + (price * item.quantity);
            }, 0);

            const formatCurrency = (val) => {
                return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(val);
            };

            if (loading) {
                return (
                    <div className="flex items-center justify-center h-screen">
                        <div className="text-xl font-semibold text-gray-600">Loading product database...</div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto p-4 flex flex-col min-h-screen">
                    <header className="text-center mb-6 flex justify-between items-center">
                        <div className="text-left">
                            <h1 className="text-3xl font-bold text-red-600">La Gallega</h1>
                            <p className="text-gray-600 text-sm">Barcode Product Finder</p>
                        </div>
                        <button 
                            onClick={() => setShowCart(!showCart)}
                            className="relative bg-white p-3 rounded-full shadow-md text-gray-700 hover:text-red-600 transition-colors"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                            {cart.length > 0 && (
                                <span className="absolute -top-1 -right-1 bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded-full">
                                    {cart.reduce((a, b) => a + b.quantity, 0)}
                                </span>
                            )}
                        </button>
                    </header>

                    {showCart && (
                        <div className="bg-white rounded-xl shadow-lg mb-6 overflow-hidden border border-gray-200 animate-slide-down">
                            <div className="p-4 bg-gray-50 border-b flex justify-between items-center">
                                <h3 className="font-bold text-gray-700">Your Cart</h3>
                                <button onClick={clearCart} className="text-xs text-red-500 font-semibold hover:underline">Clear All</button>
                            </div>
                            <div className="max-h-80 overflow-y-auto">
                                {cart.length === 0 ? (
                                    <div className="p-8 text-center text-gray-400">Your cart is empty</div>
                                ) : (
                                    <ul className="divide-y divide-gray-100">
                                        {cart.map(item => (
                                            <li key={item.barcode} className="p-4 flex gap-3">
                                                {item.image_url && (
                                                    <img src={item.image_url} className="w-12 h-12 object-contain bg-white rounded shadow-sm" />
                                                )}
                                                <div className="flex-grow">
                                                    <div className="text-xs font-bold text-gray-800 uppercase line-clamp-1">{item.name}</div>
                                                    <div className="text-xs text-gray-500">${item.price} each</div>
                                                    <div className="flex items-center mt-2 gap-3">
                                                        <div className="flex items-center border rounded">
                                                            <button onClick={() => updateQuantity(item.barcode, -1)} className="px-2 py-1 text-gray-500 hover:bg-gray-100">-</button>
                                                            <span className="px-3 py-1 text-sm font-semibold">{item.quantity}</span>
                                                            <button onClick={() => updateQuantity(item.barcode, 1)} className="px-2 py-1 text-gray-500 hover:bg-gray-100">+</button>
                                                        </div>
                                                        <div className="text-sm font-bold text-green-600 ml-auto">
                                                            {formatCurrency(item.quantity * parseFloat(item.price.replace(/\./g, '').replace(',', '.')))}
                                                        </div>
                                                    </div>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </div>
                            {cart.length > 0 && (
                                <div className="p-4 bg-gray-50 border-t flex justify-between items-center">
                                    <div className="text-gray-500 font-semibold">Total:</div>
                                    <div className="text-xl font-black text-green-600">{formatCurrency(cartTotal)}</div>
                                </div>
                            )}
                            <div className="p-2 bg-gray-100 text-center">
                                <button onClick={() => setShowCart(false)} className="text-xs text-gray-500 py-1 w-full">Close Cart</button>
                            </div>
                        </div>
                    )}

                    {error && (
                        <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-center">
                            {error}
                        </div>
                    )}

                    <main className="flex-grow">
                        {!isScannerActive && !scannedProduct && (
                            <div className="flex flex-col items-center justify-center space-y-4 mt-6">
                                {/* Search Bar */}
                                <div className="w-full mb-2">
                                    <div className="relative">
                                        <input 
                                            type="text" 
                                            placeholder="Search product by name..." 
                                            className="w-full p-4 pl-12 rounded-xl border border-gray-200 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                                            value={searchTerm}
                                            onChange={(e) => {
                                                setSearchTerm(e.target.value);
                                                if (error) setError(null);
                                            }}
                                        />
                                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                            </svg>
                                        </div>
                                    </div>
                                    
                                    {searchTerm.length >= 3 && (
                                        <div className="mt-2 bg-white border border-gray-100 rounded-xl shadow-xl max-h-80 overflow-y-auto z-10 relative">
                                            {Object.values(products)
                                                .filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()))
                                                .slice(0, 20)
                                                .map(p => (
                                                    <div key={p.barcode} className="p-4 border-b border-gray-50 last:border-0 flex items-center justify-between hover:bg-gray-50 transition-colors">
                                                        <div className="flex items-center gap-3 overflow-hidden">
                                                            {p.image_url && <img src={p.image_url} className="w-10 h-10 object-contain bg-white" />}
                                                            <div className="overflow-hidden">
                                                                <div className="text-xs font-bold uppercase truncate">{p.name}</div>
                                                                <div className="text-xs text-green-600 font-bold">${p.price}</div>
                                                            </div>
                                                        </div>
                                                        <button 
                                                            onClick={() => {
                                                                addToCart(p);
                                                                setSearchTerm("");
                                                            }}
                                                            className="bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 shadow-sm flex-shrink-0"
                                                            title="Add to cart"
                                                        >
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                                                <path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 100-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" />
                                                            </svg>
                                                        </button>
                                                    </div>
                                                ))
                                            }
                                            {Object.values(products).filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase())).length === 0 && (
                                                <div className="p-8 text-center text-gray-400 italic">No products found</div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                <div className="flex items-center w-full gap-4 py-2">
                                    <div className="h-px bg-gray-200 flex-grow"></div>
                                    <span className="text-gray-400 text-xs font-bold uppercase tracking-widest">OR</span>
                                    <div className="h-px bg-gray-200 flex-grow"></div>
                                </div>

                                <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-lg">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 17h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                                    </svg>
                                </div>
                                <button 
                                    onClick={startScanner}
                                    className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transition-transform active:scale-95 w-full text-lg"
                                >
                                    Start Scanning
                                </button>
                                <p className="text-sm text-gray-500 pb-4">Database: {Object.keys(products).length} products</p>
                            </div>
                        )}

                        {isScannerActive && (
                            <div className="space-y-4">
                                <div id="reader"></div>
                                <button 
                                    onClick={stopScanner}
                                    className="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded w-full"
                                >
                                    Cancel
                                </button>
                                <div className="text-center text-gray-600 italic">
                                    Align barcode within the rectangle
                                </div>
                            </div>
                        )}

                        {scannedProduct && (
                            <div className="bg-white rounded-xl shadow-xl overflow-hidden animate-bounce-in">
                                {scannedProduct.image_url && (
                                    <div className="h-64 bg-white flex items-center justify-center p-4">
                                        <img 
                                            src={scannedProduct.image_url} 
                                            alt={scannedProduct.name}
                                            className="max-h-full max-w-full object-contain"
                                        />
                                    </div>
                                )}
                                <div className="p-6 border-t border-gray-100">
                                    <div className="text-sm text-gray-400 mb-1">Barcode: {scannedProduct.barcode}</div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-2 leading-tight uppercase">
                                        {scannedProduct.name}
                                    </h2>
                                    <div className="flex justify-between items-end mt-4">
                                        <div>
                                            <div className="text-xs text-gray-400 uppercase tracking-wider">Category</div>
                                            <div className="text-gray-600">{scannedProduct.category}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-3xl font-black text-green-600">
                                                ${scannedProduct.price}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={() => addToCart(scannedProduct)}
                                        className="mt-8 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg w-full transition-colors mb-2"
                                    >
                                        Add to Cart
                                    </button>

                                    <button 
                                        onClick={startScanner}
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg w-full transition-colors"
                                    >
                                        Scan Another
                                    </button>
                                </div>
                            </div>
                        )}
                        
                    </main>

                    <footer className="mt-10 py-6 text-center text-gray-400 text-xs border-t border-gray-200">
                        &copy; 2026 La Gallega Product Finder
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
