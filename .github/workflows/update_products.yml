name: Update Products

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Scraper
        run: python la_gallega_scraper.py

      - name: Convert CSV to JSON
        run: python csv_to_json.py

      - name: Sync githubfolder
        run: |
          cp products.json githubfolder/products.json
          cp lagallega_products.csv githubfolder/lagallega_products.csv || true

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add githubfolder/products.json
          git commit -m "Auto-update product data in githubfolder" || echo "No changes to commit"
          git push
